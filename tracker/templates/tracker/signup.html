{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Quantum Money</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0F172A', // Deep Navy Blue
                        brandAccent: '#38BDF8', // Sky Blue
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom animation for money icons */
        @keyframes floatMoney {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.1; }
            50% { transform: translate(50px, 100px) rotate(180deg); opacity: 0.15; }
            100% { transform: translate(-50px, 200px) rotate(360deg); opacity: 0.1; }
        }
        .money-icon {
            animation: floatMoney 15s infinite linear;
            position: absolute;
        }
        /* Glassmorphism container */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* Custom styling for Django form inputs inside signup */
        .signup-form p {
            margin-bottom: 1rem;
        }
        .signup-form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }
        .signup-form input {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            color: white;
            transition: all 150ms ease-in-out;
        }
        .signup-form input:focus {
            outline: none;
            border-color: #38BDF8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .signup-form ul.errorlist {
            color: #f87171;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            list-style-type: disc;
            padding-left: 1rem;
        }
        .signup-form .helptext {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="h-full font-sans bg-brandDark text-gray-200 relative overflow-y-auto flex items-center justify-center p-4 py-10">

    <!-- Animated Money Background Icons -->
    <div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
        <img src="https://img.icons8.com/fluency/96/000000/money-bag-euro.png" class="money-icon" style="top: 10%; left: 5%; animation-delay: 0s; width: 60px;">
        <img src="https://img.icons8.com/fluency/96/000000/cash-flow.png" class="money-icon" style="top: 20%; left: 80%; animation-delay: -5s; width: 80px;">
        <img src="https://img.icons8.com/fluency/96/000000/bank-card-back-side.png" class="money-icon" style="top: 60%; left: 15%; animation-delay: -2s; width: 50px;">
        <img src="https://img.icons8.com/fluency/96/000000/increase.png" class="money-icon" style="top: 75%; left: 70%; animation-delay: -8s; width: 70px;">
        <img src="https://img.icons8.com/fluency/96/000000/money-bag.png" class="money-icon" style="top: 40%; left: 45%; animation-delay: -12s; width: 40px;">
    </div>

    <!-- Signup Container (Glassmorphism Card) -->
    <div class="w-full max-w-md glass-card rounded-3xl p-8 z-10 relative shadow-2xl my-auto">
        
        <!-- App Logo & Header -->
        <div class="text-center mb-6">
            <img src="{% static 'icon.png' %}" alt="Quantum Money Logo" class="w-20 h-20 mx-auto mb-3 p-2 bg-gray-900 rounded-3xl shadow-lg object-contain">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Create Account</h1>
            <p class="text-gray-400 text-sm mt-1">Start tracking your money securely</p>
        </div>

        <!-- Signup Form -->
        <form method="POST" class="space-y-4 signup-form">
            {% csrf_token %}
            
            <!-- Django Form Fields -->
            {{ form.as_p }}

            <!-- Submit Button -->
            <button type="submit" class="w-full py-4 mt-2 bg-brandAccent text-brandDark font-bold rounded-xl shadow-lg hover:bg-sky-400 transition duration-300 transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-brandAccent">
                Sign Up
            </button>
        </form>

        <!-- Login Link -->
        <div class="mt-6 text-center text-sm text-gray-400">
            <p>Already have an account? <a href="{% url 'login' %}" class="text-brandAccent font-semibold hover:underline">Log in</a></p>
        </div>
    </div>

</body>
</html>
