{% load static %}
<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Spy</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#030712">

    <!-- Apple Touch Icon & Web App Title for iOS Safari -->
    <link rel="apple-touch-icon" href="{% static 'icon.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Money Spy">

    <!-- Application Name for Android / Other Browsers -->
    <meta name="application-name" content="Money Spy">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        body.modal-open {
            overflow: hidden !important;
            position: fixed;
            width: 100%;
        }

        .dark-mode, .dark-mode body {
            color: #f3f4f6 !important;
        }
        .dark-mode input, .dark-mode select, .dark-mode textarea {
            background-color: #1f2937 !important;
            color: #ffffff !important;
            border-color: #374151 !important;
        }

        input[type="date"], .date-input-field {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
    <!-- Instant Dark Mode Script -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">
    
    <!-- Full Screen Mobile App Container -->
    <div class="min-h-screen w-full bg-white dark:bg-gray-950 flex flex-col justify-between relative overflow-x-hidden transition-colors duration-300">
        
        <!-- Main Scrollable Content Area -->
        <div class="flex-1 w-full pb-24 overflow-y-auto">
            {% block content %}
            {% endblock %}
        </div>

        <!-- Bottom Navigation Bar (Fixed Full-Width) - FinAI placed between Budget and Settings -->
        <div class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 py-3 px-4 flex justify-around items-center text-gray-600 dark:text-gray-400 shadow-xl z-50 transition-colors duration-300">
            <a href="{% url 'dashboard' %}" class="flex flex-col items-center hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                <i class="fas fa-chart-pie text-xl"></i>
                <span class="text-[11px] mt-1 font-medium" data-bn="হোম" data-en="Home">হোম</span>
            </a>
            <a href="{% url 'calendar' %}" class="flex flex-col items-center hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                <i class="fas fa-calendar-alt text-xl"></i>
                <span class="text-[11px] mt-1 font-medium" data-bn="ক্যালেন্ডার" data-en="Calendar">ক্যালেন্ডার</span>
            </a>
            <a href="{% url 'budget' %}" class="flex flex-col items-center hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                <i class="fas fa-wallet text-xl"></i>
                <span class="text-[11px] mt-1 font-medium" data-bn="বাজেট" data-en="Budget">বাজেট</span>
            </a>
            <!-- FinAI Chatbot Menu Item -->
            <a href="{% url 'finai_chat' %}" class="flex flex-col items-center text-indigo-600 dark:text-indigo-400 font-semibold transition">
                <div class="relative">
                    <i class="fas fa-robot text-xl animate-pulse"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-emerald-500 rounded-full"></span>
                </div>
                <span class="text-[11px] mt-1 font-medium" data-bn="FinAI" data-en="FinAI">FinAI</span>
            </a>
            <a href="{% url 'settings' %}" class="flex flex-col items-center hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                <i class="fas fa-cog text-xl"></i>
                <span class="text-[11px] mt-1 font-medium" data-bn="সেটিংস" data-en="Settings">সেটিংস</span>
            </a>
        </div>

    </div>

    <!-- Global Translation Script -->
    <script>
        const globalTranslations = {
            bn: { nav_home: "হোম", nav_calendar: "ক্যালেন্ডার", nav_budget: "বাজেট", nav_finai: "FinAI", nav_settings: "সেটিংস" },
            en: { nav_home: "Home", nav_calendar: "Calendar", nav_budget: "Budget", nav_finai: "FinAI", nav_settings: "Settings" }
        };

        function applyGlobalTranslation(lang) {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-bn]').forEach(el => {
                if (lang === 'en' && el.hasAttribute('data-en')) {
                    el.innerText = el.getAttribute('data-en');
                } else if (lang === 'bn' && el.hasAttribute('data-bn')) {
                    el.innerText = el.getAttribute('data-bn');
                }
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('language') || 'bn';
            applyGlobalTranslation(savedLang);
        });

        window.addEventListener('pageshow', function (event) {
            if (event.persisted) { window.location.reload(); }
        });
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>
</html>
