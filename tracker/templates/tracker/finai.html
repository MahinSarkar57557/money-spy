{% extends 'tracker/base.html' %}
{% block content %}
<div class="max-w-md mx-auto p-4 flex flex-col h-[calc(100vh-80px)]">
    
    <!-- Top Header Profile -->
    <div class="flex items-center justify-between pb-4 border-b border-gray-200 dark:border-gray-800 mb-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md">
                <i class="fas fa-robot text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base text-gray-900 dark:text-white flex items-center gap-1.5">
                    FinAI Assistant <span class="text-xs px-2 py-0.5 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-full font-medium">Online</span>
                </h1>
                <p class="text-xs text-gray-500 dark:text-gray-400">আপনার স্মার্ট ফিন্যান্সিয়াল পার্টনার</p>
            </div>
        </div>
        <button onclick="clearChat()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-sm p-2 rounded-lg transition" title="চ্যাট রিসেট করুন">
            <i class="fas fa-trash-alt"></i>
        </button>
    </div>

    <!-- Chat Messages Scrollable Area -->
    <div id="chat-container" class="flex-1 overflow-y-auto space-y-4 pr-1 mb-4 scroll-smooth">
        <!-- Messages will be loaded here dynamically -->
    </div>

    <!-- Input Bar with Voice & Send Button -->
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-2 rounded-2xl shadow-lg flex items-center space-x-2">
        <button id="mic-btn" type="button" class="w-11 h-11 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center justify-center transition shrink-0" title="মুখে বলুন">
            <i class="fas fa-microphone text-base" id="mic-icon"></i>
        </button>
        
        <input type="text" id="user-input" placeholder="বাংলা বা ইংরেজিতে লিখুন..." class="flex-1 bg-transparent border-none focus:outline-none text-sm text-gray-800 dark:text-gray-100 px-2 placeholder-gray-400">
        
        <button id="send-btn" type="button" class="w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center transition shadow-md shrink-0">
            <i class="fas fa-paper-plane text-sm"></i>
        </button>
    </div>

</div>

<!-- JavaScript Logic with Dynamic Language Support & Voice Input -->
<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const micIcon = document.getElementById('mic-icon');

    // Load Chat History from sessionStorage on page load
    document.addEventListener("DOMContentLoaded", () => {
        const savedHistory = sessionStorage.getItem('finai_chat_history');
        const currentLang = localStorage.getItem('language') || 'bn';
        
        if (savedHistory) {
            chatContainer.innerHTML = savedHistory;
        } else {
            if (currentLang === 'en') {
                appendMessage('bot', `Hello! I am <strong>FinAI</strong>. You can add expenses/incomes or ask financial questions in English or Bengali. <br><code class="text-xs bg-gray-100 dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded mt-1 inline-block">"Add 50 taka expense on transport"</code>`);
            } else {
                appendMessage('bot', `হ্যালো! আমি <strong>FinAI</strong>। আপনি বাংলা বা ইংরেজিতে খরচ বা আয় যোগ করতে পারেন। যেমন: <br><code class="text-xs bg-gray-100 dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded mt-1 inline-block">"add 20 taka expense on book"</code> অথবা <br><code class="text-xs bg-gray-100 dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded mt-1 inline-block">"বই বাবদ ২০ টাকা খরচ"</code>`);
            }
        }
        chatContainer.scrollTop = chatContainer.scrollHeight;
    });

    function saveChatHistory() {
        sessionStorage.setItem('finai_chat_history', chatContainer.innerHTML);
    }

    function appendMessage(sender, text) {
        const isUser = sender === 'user';
        const msgWrapper = document.createElement('div');
        msgWrapper.className = `flex items-start space-x-2 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
        
        msgWrapper.innerHTML = `
            <div class="w-7 h-7 rounded-full ${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} text-white flex items-center justify-center text-xs shrink-0 mt-1">
                <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
            </div>
            <div class="${isUser ? 'bg-indigo-600 text-white rounded-tr-sm' : 'bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 text-gray-800 dark:text-gray-200 rounded-tl-sm'} p-3.5 rounded-2xl shadow-sm max-w-[80%] text-sm leading-relaxed">
                ${text}
            </div>
        `;
        chatContainer.appendChild(msgWrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        saveChatHistory();
    }

    function handleUserSubmit() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        const currentText = text;
        userInput.value = '';

        // Retrieve settings language preference ('bn' or 'en')
        const preferredLang = localStorage.getItem('language') || 'bn';

        // Send to Django backend API with language setting
        fetch('/api/finai-process/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ 
                message: currentText, 
                language: preferredLang 
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                appendMessage('bot', data.reply);
            } else {
                appendMessage('bot', data.reply || (preferredLang === 'bn' ? 'দুঃখিত, একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।' : 'Sorry, something went wrong.'));
            }
        })
        .catch(error => {
            appendMessage('bot', preferredLang === 'bn' ? 'সার্ভারে সংযোগ স্থাপন করা যায়নি।' : 'Unable to connect to the server.');
        });
    }

    sendBtn.onclick = handleUserSubmit;
    userInput.onkeypress = (e) => {
        if (e.key === 'Enter') handleUserSubmit();
    };

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Cross-Platform Web Speech API (Android Chrome & iPhone Safari compatibility)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'bn-BD'; // Supports mixed audio capture
        recognition.continuous = false;
        recognition.interimResults = false;

        let isRecording = false;

        micBtn.onclick = () => {
            try {
                if (!isRecording) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            } catch (err) {
                alert('দয়া করে মাইক্রোফোন ব্যবহারের অনুমতি দিন বা HTTPS ব্যবহার নিশ্চিত করুন।');
            }
        };

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
            micIcon.className = 'fas fa-microphone-slash text-base';
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            handleUserSubmit();
        };

        recognition.onerror = () => {
            stopMicState();
        };

        recognition.onend = () => {
            stopMicState();
        };

        function stopMicState() {
            isRecording = false;
            micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
            micIcon.className = 'fas fa-microphone text-base';
        }
    } else {
        micBtn.style.display = 'none';
    }

    function clearChat() {
        sessionStorage.removeItem('finai_chat_history');
        chatContainer.innerHTML = '';
        const currentLang = localStorage.getItem('language') || 'bn';
        appendMessage('bot', currentLang === 'en' ? 'Chat history cleared. Let’s start fresh!' : 'চ্যাট হিস্ট্রি রিসেট করা হয়েছে। নতুন করে শুরু করুন!');
    }
</script>
{% endblock %}
